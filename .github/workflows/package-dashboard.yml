name: Build Tony's Dockside Presentation Dashboard Package

on:
  push:
    branches:
      - dashboard-package-build
    paths:
      - '.github/workflows/package-dashboard.yml'
      - 'tools/package_dashboard.py'
      - 'index.html'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 requests pillow
      - name: Build independent website package
        run: python tools/package_dashboard.py index.html dashboard-output --zip Tonys-Dockside-Presentation-Dashboard.zip
      - name: Upload finished ZIP and validation reports
        uses: actions/upload-artifact@v4
        with:
          name: Tonys-Dockside-Presentation-Dashboard
          path: |
            dashboard-output/Tonys-Dockside-Presentation-Dashboard.zip
            dashboard-output/VALIDATION.json
            dashboard-output/POST_EXTRACT_VALIDATION.json
          if-no-files-found: error
          retention-days: 1
