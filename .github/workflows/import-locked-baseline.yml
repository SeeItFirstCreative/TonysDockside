name: Import Locked Baseline V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-locked-baseline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download approved Tony's Dockside client-review build
        run: curl -fsSL --compressed 'https://tonys-dockside-review-assets-ieqlvky6z.vercel.app/' -o index.html

      - name: Verify approved client-review checksum
        run: |
          echo '27af4233e3efa8ccab717c2191c743d700b9f7b9679fe82fa6f198e4cff9bf4c  index.html' | sha256sum -c -

      - name: Commit approved client-review build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Deploy Tony Dockside Locked Baseline V2 client build'
          git push
