name: Build Tony's Dockside Presentation Dashboard All Variations
on:
  push:
    branches: [dashboard-package-build]
    paths: ['tools/package_dashboard_all.py','tools/browser_validate_all.py','.github/workflows/package-dashboard-v5.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check beautifulsoup4 requests pillow selenium
      - name: Build all independent sites
        run: PYTHONPATH=tools python tools/package_dashboard_all.py index.html dashboard-output --zip intermediate.zip
      - name: Repackage with websites and logo-boards at ZIP root
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('dashboard-output/client-project')
          out=Path('dashboard-output/Tonys-Dockside-Presentation-Dashboard.zip')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for p in root.rglob('*'):
              if p.is_file(): z.write(p,p.relative_to(root))
          test=Path('dashboard-output/root-test'); test.mkdir()
          with zipfile.ZipFile(out) as z:z.extractall(test)
          assert (test/'websites/website-01/index.html').exists()
          assert (test/'websites/website-02/index.html').exists()
          assert (test/'websites/website-03/index.html').exists()
          assert (test/'websites/website-04/index.html').exists()
          assert not (test/'client-project').exists()
          PY
      - name: Browser validate every independent website
        run: python tools/browser_validate_all.py
      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Tonys-Dockside-Presentation-Dashboard-All-Variations
          path: |
            dashboard-output/Tonys-Dockside-Presentation-Dashboard.zip
            dashboard-output/POST_EXTRACT_VALIDATION.json
            dashboard-output/browser-test-all/BROWSER_VALIDATION.json
          retention-days: 1
