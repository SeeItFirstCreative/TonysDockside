<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tony's Dockside — Client Review</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071018;font-family:Arial,sans-serif}.stage{position:fixed;inset:0}.stage iframe{width:100%;height:100%;border:0;background:#071018}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#071018;color:#fff;z-index:1;transition:.25s}.loading.hide{opacity:0;pointer-events:none}.loadmark{text-align:center}.loadmark b{font-size:34px;letter-spacing:-.04em}.loadmark span{display:block;margin-top:8px;color:#7e969f;font-size:10px;letter-spacing:.17em;text-transform:uppercase}.theme-tab{position:fixed;right:0;top:45%;z-index:30;width:45px;height:156px;border:0;background:#08141c;color:#fff;border-radius:16px 0 0 16px;box-shadow:0 12px 38px #0007;cursor:pointer}.theme-tab span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.panel{position:fixed;z-index:40;right:14px;top:50%;transform:translate(115%,-50%);width:min(326px,calc(100vw - 42px));padding:16px;background:#071018f6;color:#fff;border:1px solid #ffffff20;border-radius:18px;box-shadow:0 26px 80px #000b;backdrop-filter:blur(20px);transition:.35s cubic-bezier(.2,.75,.2,1)}.panel.open{transform:translate(0,-50%)}.head{display:flex;align-items:center;justify-content:space-between;padding:3px 3px 13px;border-bottom:1px solid #ffffff14}.head strong{font-size:15px}.head small{display:block;margin-top:4px;color:#8ca0a8;font-size:10px}.close{width:35px;height:35px;border:1px solid #ffffff20;background:#ffffff08;color:#fff;font-size:22px}.choices{display:grid;gap:7px;margin-top:13px}.choices button{border:1px solid #ffffff1d;background:#ffffff08;color:#dce7eb;padding:13px 12px;text-align:left;font-size:12px;font-weight:900;letter-spacing:.02em}.choices button.active{background:#fff;color:#071018;border-color:#fff}.badge{position:fixed;left:12px;top:12px;z-index:20;padding:8px 10px;background:#071018c9;color:#9db0b7;border:1px solid #ffffff16;border-radius:999px;font:800 8px Arial;letter-spacing:.12em;text-transform:uppercase;backdrop-filter:blur(12px)}@media(max-width:650px){.badge{display:none}.theme-tab{top:39%;width:40px;height:140px}.panel{right:8px;width:min(290px,calc(100vw - 28px));max-height:75vh;overflow:auto}}</style></head><body><div class="stage"><div class="loading" id="loading"><div class="loadmark"><b>TONY'S DOCKSIDE</b><span>Loading client review</span></div></div><iframe id="view" title="Tony's Dockside design review"></iframe></div><div class="badge">Client presentation / Marco Island</div><button class="theme-tab" id="tab" aria-label="Open Theme Switcher"><span>Theme Switcher</span></button><aside class="panel" id="panel"><div class="head"><div><strong>Theme Switcher</strong><small>Website concepts + logo directions</small></div><button class="close" id="close">×</button></div><div class="choices"><button data-key="harbor" class="active">01 Harbor Response</button><button data-key="estate">02 Waterfront Care</button><button data-key="command">03 Command Deck</button><button data-key="mechanical">04 Mechanical</button><button data-key="logos">05 Logo Concepts</button></div></aside><script>const frame=document.getElementById('view'),load=document.getElementById('loading'),panel=document.getElementById('panel');const remoteBase='https://tonys-dockside-mockup-build.vercel.app/';const map={harbor:'index.html',estate:'elevated.html',mechanical:'mechanical.html'};function setActive(k){document.querySelectorAll('[data-key]').forEach(b=>b.classList.toggle('active',b.dataset.key===k));history.replaceState(null,'','?concept='+k)}async function show(k){setActive(k);load.classList.remove('hide');panel.classList.remove('open');if(k==='command'||k==='logos'){frame.removeAttribute('srcdoc');frame.src=k+'.html';frame.onload=()=>load.classList.add('hide');return}try{const r=await fetch(remoteBase+map[k],{cache:'no-store'});let h=await r.text();h=h.replace(/<head>/i,'<head><base href="'+remoteBase+'"><style>.concept-switch{display:none!important}.progress{top:0!important}</style>');frame.removeAttribute('src');frame.srcdoc=h;frame.onload=()=>load.classList.add('hide')}catch(e){frame.src=remoteBase+map[k];frame.onload=()=>load.classList.add('hide')}}document.getElementById('tab').onclick=()=>panel.classList.toggle('open');document.getElementById('close').onclick=()=>panel.classList.remove('open');document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>show(b.dataset.key));const q=new URLSearchParams(location.search).get('concept');show(['harbor','estate','command','mechanical','logos'].includes(q)?q:'harbor');</script></body></html>
